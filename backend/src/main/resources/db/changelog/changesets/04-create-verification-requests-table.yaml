databaseChangeLog:
  - changeSet:
      id: 04-create-verification-requests-table
      author: Bolot Azatov
      comment: "Таблица заявок пользователей на привилегированные роли"
      changes:
        - createTable:
            tableName: verification_requests
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_verification_requests_user
                    references: users(id)
              - column:
                  name: target_role
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: organization_name
                  type: VARCHAR(150)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: document_urls
                  type: TEXT
              - column:
                  name: proposed_location
                  type: "GEOGRAPHY(Point, 4326)"
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: "PENDING"
                  constraints:
                    nullable: false
              - column:
                  name: admin_comment
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_verification_requests_status
            tableName: verification_requests
            columns:
              - column:
                  name: status