databaseChangeLog:
  - changeSet:
      id: 02-create-users-table
      author: Bolot Azatov
      comment: "Создание базовой таблицы пользователей с гео-позицией"
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(25)
              - column:
                  name: role
                  type: VARCHAR(30)
                  defaultValue: "ROLE_USER"
                  constraints:
                    nullable: false
              - column:
                  name: is_email_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: location
                  type: "GEOGRAPHY(Point, 4326)"
              - column:
                  name: fcm_token
                  type: VARCHAR(255)
              - column:
                  name: preferred_lang
                  type: VARCHAR(5)
                  defaultValue: "ru"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 02-create-users-location-gist-index
      author: Bolot Azatov
      comment: "Создание GiST пространственного индекса для быстрого гео-поиска"
      changes:
        - sql:
            sql: CREATE INDEX idx_users_location ON users USING GIST (location);