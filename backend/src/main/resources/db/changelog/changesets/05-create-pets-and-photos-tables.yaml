databaseChangeLog:
  - changeSet:
      id: 05-create-pets-table
      author: Bolot Azatov
      comment: "Таблица питомцев с параметрами для вязки, здоровьем и физ. данными"
      changes:
        - createTable:
            tableName: pets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_pets_owner
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: breed_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_pets_breed
                    references: breeds(id)
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: birth_date
                  type: DATE
              - column:
                  name: color
                  type: VARCHAR(50)
              - column:
                  name: weight_kg
                  type: NUMERIC(4, 1)
              - column:
                  name: has_pedigree
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: has_vet_passport
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: is_mating_available
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: bio
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_pets_owner_id
            tableName: pets
            columns:
              - column:
                  name: owner_id

        - createIndex:
            indexName: idx_pets_mating_search
            tableName: pets
            columns:
              - column:
                  name: breed_id
              - column:
                  name: gender
              - column:
                  name: is_mating_available

  - changeSet:
      id: 05-create-pet-photos-table
      author: Bolot Azatov
      comment: "Ссылки на фотографии питомцев в MinIO/S3"
      changes:
        - createTable:
            tableName: pet_photos
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: pet_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_pet_photos_pet
                    references: pets(id)
                    deleteCascade: true
              - column:
                  name: photo_url
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: is_main
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_pet_photos_pet_id
            tableName: pet_photos
            columns:
              - column:
                  name: pet_id