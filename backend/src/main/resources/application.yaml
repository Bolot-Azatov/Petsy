spring:
  application:
    name: petsy

  datasource:
    url: jdbc:postgresql://localhost:5432/petsy_db
    username: petsy_user
    password: petsy_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Кастомные настройки для MinIO
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: miniopassword
  bucket-name: petsy-media

jwt:
  secret: ${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
  access-expiration: 900000
  refresh-expiration: 2592000000